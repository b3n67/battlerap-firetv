name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;36.0.0"
      - name: Throwaway keystore
        run: |
          mkdir -p ~/.keystore
          keytool -genkeypair -keystore ~/.keystore/battlerap-firetv.jks \
            -storepass cipassword -keypass cipassword -alias battlerap -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=ci"
      - run: ./gradlew assembleRelease testDebugUnitTest lintDebug --no-daemon \
          -PbattlerapStorePassword=cipassword -PbattlerapKeyPassword=cipassword
