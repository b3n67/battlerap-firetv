plugins {
    id 'com.android.application'
}

android {
    namespace 'de.battlerap.tvapp'
    compileSdk 34
    // Pinned: only this build-tools version is installed (AGP default 34.0.0 is missing).
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'de.battlerap.tvapp'
        minSdk 22
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        release {
            storeFile file("${System.getProperty('user.home')}/.keystore/battlerap-firetv.jks")
            storePassword project.findProperty('battlerapStorePassword')
            keyAlias 'battlerap'
            keyPassword project.findProperty('battlerapKeyPassword')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
